<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
  <title id="t">Multiple inheritance in memory</title>
  <desc id="d">An io::Buffer object with two vtable pointers, its two vtables, and the functions in .text their slots point to.</desc>
  <style>
    text { font-family: ui-monospace, 'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .flow { fill: none; stroke-dasharray: 2 10; stroke-linecap: round; animation: flow 1.3s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    .fade { opacity: 0; animation: fade 0.6s ease-out forwards; }
    @keyframes fade { to { opacity: 1; } }
    
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } .fade { animation: none; opacity: 1; } .anim { animation: none !important; } }
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1c2128"/></pattern>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#30363d" stroke-width="2"/></pattern>
    <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#f778ba"/><stop offset="0.6" stop-color="#f778ba" stop-opacity="0.35"/><stop offset="1" stop-color="#f778ba" stop-opacity="0"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker>
    <clipPath id="card"><rect width="1200" height="480" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="480" fill="#0d1117"/>
    <rect width="1200" height="480" fill="url(#dots)"/>
    <rect width="1200" height="3" fill="url(#edge)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="478.5" rx="15.5" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="40" y="48" font-size="13" letter-spacing="2" fill="#f778ba">MULTIPLE INHERITANCE IN MEMORY · io::Buffer in sample64.dll</text>
  <text x="40" y="76" font-size="13" fill="#8b949e" text-anchor="start" xml:space="preserve">io::Buffer derives from Reader and Writer, so each object carries two vtable pointers. RVAs are from vtable-dump.</text>
  <rect x="40" y="140" width="250" height="118" rx="8" fill="#161b22" stroke="#f778ba"/>
  <rect x="40" y="140" width="250" height="28" rx="8" fill="#f778ba" fill-opacity="0.14"/>
  <text x="52" y="159" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="700" xml:space="preserve">io::Buffer object</text>
  <text x="52" y="188" font-size="11.5" fill="#8b949e" text-anchor="start" xml:space="preserve">+0x00</text>
  <text x="278" y="188" font-size="11.5" fill="#f778ba" text-anchor="end" xml:space="preserve">vfptr (Reader view)</text>
  <text x="52" y="214" font-size="11.5" fill="#8b949e" text-anchor="start" xml:space="preserve">+0x08</text>
  <text x="278" y="214" font-size="11.5" fill="#f778ba" text-anchor="end" xml:space="preserve">vfptr (Writer view)</text>
  <text x="52" y="240" font-size="11.5" fill="#8b949e" text-anchor="start" xml:space="preserve">+0x10</text>
  <text x="278" y="240" font-size="11.5" fill="#c9d1d9" text-anchor="end" xml:space="preserve">int value_</text>
  <rect x="400" y="110" width="300" height="103" rx="8" fill="#161b22" stroke="#f778ba"/>
  <rect x="400" y="110" width="300" height="28" rx="8" fill="#f778ba" fill-opacity="0.14"/>
  <text x="412" y="129" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="700" xml:space="preserve">vtable @ 0x3208 · Reader view</text>
  <text x="412" y="158" font-size="11.5" fill="#8b949e" text-anchor="start" xml:space="preserve">[-1]</text>
  <text x="688" y="158" font-size="11.5" fill="#6e7681" text-anchor="end" xml:space="preserve">&amp;COL → RTTI</text>
  <text x="412" y="179" font-size="11.5" fill="#8b949e" text-anchor="start" xml:space="preserve">[0] 0x1010</text>
  <text x="688" y="179" font-size="11.5" fill="#c9d1d9" text-anchor="end" xml:space="preserve">destructor</text>
  <text x="412" y="200" font-size="11.5" fill="#8b949e" text-anchor="start" xml:space="preserve">[1] 0x11c0</text>
  <text x="688" y="200" font-size="11.5" fill="#c9d1d9" text-anchor="end" xml:space="preserve">read()</text>
  <rect x="400" y="270" width="300" height="124" rx="8" fill="#161b22" stroke="#f778ba"/>
  <rect x="400" y="270" width="300" height="28" rx="8" fill="#f778ba" fill-opacity="0.14"/>
  <text x="412" y="289" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="700" xml:space="preserve">vtable @ 0x3220 · Writer view</text>
  <text x="412" y="318" font-size="11.5" fill="#8b949e" text-anchor="start" xml:space="preserve">[-1]</text>
  <text x="688" y="318" font-size="11.5" fill="#6e7681" text-anchor="end" xml:space="preserve">&amp;COL → RTTI</text>
  <text x="412" y="339" font-size="11.5" fill="#8b949e" text-anchor="start" xml:space="preserve">[0] 0x1000</text>
  <text x="688" y="339" font-size="11.5" fill="#c9d1d9" text-anchor="end" xml:space="preserve">destructor (thunk)</text>
  <text x="412" y="360" font-size="11.5" fill="#8b949e" text-anchor="start" xml:space="preserve">[1] 0x11f0</text>
  <text x="688" y="360" font-size="11.5" fill="#c9d1d9" text-anchor="end" xml:space="preserve">write()</text>
  <text x="412" y="381" font-size="11.5" fill="#8b949e" text-anchor="start" xml:space="preserve">[2] 0x1160</text>
  <text x="688" y="381" font-size="11.5" fill="#c9d1d9" text-anchor="end" xml:space="preserve">flush()</text>
  <path d="M290,184 C340,184 340,175 396,175" fill="none" stroke="#8b949e" stroke-opacity="0.45" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path class="flow" style="animation-delay: -0.00s" d="M290,184 C340,184 340,175 396,175" stroke="#f778ba" stroke-width="2"/>
  <path d="M290,210 C340,210 340,335 396,335" fill="none" stroke="#8b949e" stroke-opacity="0.45" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path class="flow" style="animation-delay: -0.40s" d="M290,210 C340,210 340,335 396,335" stroke="#f778ba" stroke-width="2"/>
  <rect x="860" y="110" width="34" height="310" rx="4" fill="#ffa657" fill-opacity="0.18" stroke="#ffa657" stroke-opacity="0.6"/>
  <text x="877" y="100" font-size="12" fill="#ffa657" text-anchor="middle" font-weight="700" xml:space="preserve">.text</text>
  <text x="877" y="438" font-size="10" fill="#6e7681" text-anchor="middle" xml:space="preserve">0x1000–0x2358</text>
  <line x1="860" y1="110.0" x2="894" y2="110.0" stroke="#ffa657" stroke-width="2"/>
  <path d="M894,110.0 L910,128" stroke="#6e7681" fill="none"/>
  <text x="914" y="132" font-size="11.5" fill="#c9d1d9" text-anchor="start" xml:space="preserve">0x1000  thunk: sub rcx,8; jmp 0x1010</text>
  <line x1="860" y1="115.7" x2="894" y2="115.7" stroke="#ffa657" stroke-width="2"/>
  <path d="M894,115.7 L910,152" stroke="#6e7681" fill="none"/>
  <text x="914" y="156" font-size="11.5" fill="#c9d1d9" text-anchor="start" xml:space="preserve">0x1010  Buffer deleting destructor</text>
  <line x1="860" y1="235.1" x2="894" y2="235.1" stroke="#ffa657" stroke-width="2"/>
  <path d="M894,235.1 L910,232" stroke="#6e7681" fill="none"/>
  <text x="914" y="236" font-size="11.5" fill="#c9d1d9" text-anchor="start" xml:space="preserve">0x1160  Writer::flush   ret 0</text>
  <line x1="860" y1="269.3" x2="894" y2="269.3" stroke="#ffa657" stroke-width="2"/>
  <path d="M894,269.3 L910,266" stroke="#6e7681" fill="none"/>
  <text x="914" y="270" font-size="11.5" fill="#c9d1d9" text-anchor="start" xml:space="preserve">0x11c0  Buffer::read    mov eax,[rcx+10h]</text>
  <line x1="860" y1="286.3" x2="894" y2="286.3" stroke="#ffa657" stroke-width="2"/>
  <path d="M894,286.3 L910,300" stroke="#6e7681" fill="none"/>
  <text x="914" y="304" font-size="11.5" fill="#c9d1d9" text-anchor="start" xml:space="preserve">0x11f0  Buffer::write   mov [rcx+8],edx</text>
  <path d="M700,175 C780,175 780,115.7 856,115.7" fill="none" stroke="#8b949e" stroke-opacity="0.45" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path class="flow" style="animation-delay: -0.00s" d="M700,175 C780,175 780,115.7 856,115.7" stroke="#ffa657" stroke-width="2"/>
  <path d="M700,196 C780,196 780,269.3 856,269.3" fill="none" stroke="#8b949e" stroke-opacity="0.45" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path class="flow" style="animation-delay: -0.25s" d="M700,196 C780,196 780,269.3 856,269.3" stroke="#ffa657" stroke-width="2"/>
  <path d="M700,335 C780,335 780,110.0 856,110.0" fill="none" stroke="#8b949e" stroke-opacity="0.45" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path class="flow" style="animation-delay: -0.50s" d="M700,335 C780,335 780,110.0 856,110.0" stroke="#ffa657" stroke-width="2"/>
  <path d="M700,356 C780,356 780,286.3 856,286.3" fill="none" stroke="#8b949e" stroke-opacity="0.45" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path class="flow" style="animation-delay: -0.75s" d="M700,356 C780,356 780,286.3 856,286.3" stroke="#ffa657" stroke-width="2"/>
  <path d="M700,377 C780,377 780,235.1 856,235.1" fill="none" stroke="#8b949e" stroke-opacity="0.45" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path class="flow" style="animation-delay: -1.00s" d="M700,377 C780,377 780,235.1 856,235.1" stroke="#ffa657" stroke-width="2"/>
  <text x="40" y="440" font-size="12" fill="#8b949e" text-anchor="start" xml:space="preserve">Code at each slot target (from the binary): the Writer view&#x27;s destructor is a thunk that moves this back 8 bytes</text>
  <text x="40" y="458" font-size="12" fill="#8b949e" text-anchor="start" xml:space="preserve">to the full object; read() returns value_ at +0x10. vtable-dump finds each table through its &amp;COL slot.</text>
</svg>
